# Homework attachments: the module clones the Overleaf project, builds the
# homework PDFs with pdflatex and renders PNGs, all under cache/.
[Service]
# The base unit only opens logs/ for writing; the build needs cache/ too.
ReadWritePaths=/home/ubuntu/CIS1600-Slack-Bot/cache
# The cap covers the whole cgroup, so pdflatex and pdftoppm count against it.
# A build measured ~30M peak; 256M leaves headroom on a 951M box.
MemoryMax=256M
